# 作业统计看板 —— 单容器部署：后端同源托管前端构建产物，SQLite 落命名卷
# 本地开发基础文件（AGENTS.md §5.4：restart 显式 no）；生产叠加 compose.prod.yaml：
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  dashboard:
    build: .
    image: homework-center:latest
    restart: "no"
    ports:
      - "18080:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    command:
      - --db=/data/center.db
      - --web=/srv/web
      - --repo=${TEMPLATE_REPO:-}
      - --sync-every=30m
    networks:
      - dashboard-net
    volumes:
      - dashboard-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  dashboard-net:
    name: homework-center-net
    driver: bridge

volumes:
  dashboard-data:
    name: homework-center-data
